repos:
  # Ruff comes from pyproject.toml, through uv.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group dev ruff check --force-exclude --fix --exit-non-zero-on-fix --config=pyproject.toml
        language: system
        types_or: [ python, pyi, jupyter ]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group dev ruff format --force-exclude
        language: system
        types_or: [ python, pyi, jupyter ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
