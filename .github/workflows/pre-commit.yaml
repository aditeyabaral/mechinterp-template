name: Pre-Commit Checks

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  pre-commit-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
            ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install tools from pyproject.toml and uv.lock
        run: uv sync --frozen --only-group dev

      - name: Run pre-commit hooks
        run: uv run --frozen --only-group dev pre-commit run --all-files
