name: Lint

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
            ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install tools from pyproject.toml and uv.lock
        run: uv sync --frozen --only-group dev

      - name: Show ruff config
        run: uv run --frozen --only-group dev ruff check --show-settings

      - name: Run Ruff Lint
        run: uv run --frozen --only-group dev ruff check . --output-format=github --config=pyproject.toml

      - name: Run Ruff Format Check
        run: uv run --frozen --only-group dev ruff format . --check
