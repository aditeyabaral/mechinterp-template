[project]
name = "MechInterpLens"
version = "0.1.0"
description = "A starter template for mechanistic interpretability on small transformers: train a toy model on a task you design, then find the neurons and attention heads that drive it."
keywords = ["mechanistic interpretability", "interpretability", "transformerlens", "transformers", "ablation", "gpt-2", "pytorch"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.11.0",
    "datasets>=4.5.0",
    "huggingface-hub>=0.35.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "networkx>=3.0",
    "protobuf>=6.33.1",
    "joblib>=1.4.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "torch>=2.6.0",
    # <5.24: transformers 5.24.0 breaks TransformerLens' cached generation (every token after the first
    # is wrong); main.py's teacher-forcing vs generation check flags it. Lift the cap once a fixed release is out.
    "transformers>=5.12.0,<5.24",
    "wandb>=0.25.0",
    "rich>=14.3.3",
    "transformer-lens>=3.2.1",
]

[project.urls]
Repository = "https://github.com/aditeyabaral/MechInterpLens"

# Dev tools, pinned so the pre-commit hook, CI and your editor all run the same ruff.
# Installed by `uv sync` (uv installs the "dev" group by default).
[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.6",
]

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes errors
    "W", # Pycodestyle warnings
    "UP", # Pyupgrade rules
    "I", # Import related rules
    "C90", # Complexity rules
    "D", # Documentation rules
    "ANN", # Annotations rules
    "TYP", # Type checking rules
    "N", # Naming rules
    "Q000", # Quotation style rules
    "RET", # Return type rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# wandb is a third-party dependency, but a gitignored local `wandb/` run-log directory
# makes ruff auto-detect it as first-party locally (while CI, lacking that dir, treats it
# as third-party) -- causing I001 to pass locally but fail on CI.
known-third-party = ["wandb"]
# src/train/scoring.py, which train_model.py imports as a plain module from its own folder.
known-first-party = ["scoring"]

[tool.ruff]
line-length = 120
target-version = "py313"  # matches requires-python

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
